services:

  flask-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "5050:5000"  # Map Flask app to localhost:5000
    volumes:
      - ../datasets:/app/datasets  # Mount datasets folder
      - ../alerts:/app/alerts
    depends_on:
      - elasticsearch
      - kibana
      - thehive
    networks:
      - threat-analysis-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports:
      - "9200:9200"
    volumes:
      - ../config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    networks:
      - threat-analysis-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.2
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTIC_SERVICE_TOKEN=AAEAAWVsYXN0aWMva2liYW5hL2RlZmF1bHQ6OXlJWEZJVDdSMWFSX0cwdTI2b0V5UQ
    ports:
      - "5601:5601"
    volumes:
      - ../config/kibana.yml:/usr/share/kibana/config/kibana.yml
    depends_on:
      - elasticsearch
    networks:
      - threat-analysis-network

  thehive:
    image: thehiveproject/thehive4:latest
    ports:
      - "0.0.0.0:9000:9000"
    environment:
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=1G
      - APPLICATION_SECRET=okCKogZSl+j9iHf2mG2vL22V4PrB4VV7OIJbcdflODA=
    volumes:
      - ../config/thehive/application.conf:/etc/thehive/application.conf
      - ./vol/thehive/application.conf:/etc/thehive/application.conf
      - ./vol/thehive/db:/opt/thp/thehive/db
      - ./vol/thehive/index:/opt/thp/thehive/index
      - ./vol/thehive/data:/opt/thp/thehive/data
    depends_on:
      - elasticsearch
    networks:
      - threat-analysis-network

networks:
  threat-analysis-network:
    driver: bridge