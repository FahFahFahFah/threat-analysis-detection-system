<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threat Analysis Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header>
        <h1>Threat Analysis Dashboard</h1>
        <p>Analyze threats, visualize results in Kibana and Elasticsearch, and automate case creation in TheHive.</p>    
    </header>

    <main>
        <section class="upload-section">
            <h2>Upload Dataset</h2>
            <form action="/upload" method="post" enctype="multipart/form-data">
                <label for="file">Upload Dataset (CSV):</label>
                <input type="file" name="file" id="file" required>
                <button type="submit">Upload and Analyze</button>
            </form>
        </section>

        <section class="integrations-section">
            <h2>Integrations</h2>
            <div class="integration-links">
                <a href="/elasticsearch-raw" target="_blank">
                    <img src="{{ url_for('static', filename='images/elasticsearchlogo.png') }}" alt="Elasticsearch Logo">
                    <span>Elasticsearch</span>
                </a>
                <a href="/kibana" target="_blank">
                    <img src="{{ url_for('static', filename='images/kibanalogo.png') }}" alt="Kibana Logo">
                    <span>Kibana</span>
                </a>
                <a href="/thehive" target="_blank">
                    <img src="{{ url_for('static', filename='images/thehivelogo.png') }}" alt="TheHive Logo">
                    <span>TheHive</span>
                </a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Threat Analysis Platform. All rights reserved.</p>
    </footer>
</body>
</html>
